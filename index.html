<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Street Fighter: Ultimate Gang War</title>
  
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body {
      background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
      color: #fff; display: flex; justify-content: center; align-items: center;
      min-height: 100vh; margin: 0; overflow: hidden;
    }
    .auth-container {
      background: rgba(22, 33, 62, 0.95); backdrop-filter: blur(10px);
      padding: 25px; border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6); text-align: center; width: 90%; max-width: 380px;
      position: relative; z-index: 10;
    }
    h2 { color: #00fff2; margin-bottom: 20px; text-shadow: 0 0 10px rgba(0, 255, 242, 0.5); }
    .input-group { position: relative; width: 100%; margin: 12px 0; }
    input {
      width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #0f3460;
      background-color: rgba(15, 52, 96, 0.7); color: #fff; outline: none; font-size: 14px;
    }
    .auth-btn {
      width: 100%; padding: 12px; margin-top: 15px; border: none; border-radius: 10px;
      background: linear-gradient(45deg, #e94560, #ff6b6b); color: white; font-weight: bold;
      font-size: 15px; cursor: pointer; box-shadow: 0 4px 15px rgba(233, 69, 96, 0.4);
    }
    .switch-auth { margin-top: 15px; font-size: 13px; color: #94a3b8; cursor: pointer; }
    .switch-auth span { color: #00fff2; font-weight: bold; text-decoration: underline; }
    #message { font-size: 13px; margin-top: 10px; font-weight: bold; }

    /* CUTSCENE SCREEN INTRO */
    #cutscene-screen {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(5, 5, 15, 0.95); backdrop-filter: blur(12px);
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      z-index: 100; text-align: center; padding: 20px;
    }
    .avatar-box {
      width: 90px; height: 90px; border-radius: 50%;
      border: 3px solid #00fff2; box-shadow: 0 0 20px rgba(0,255,242,0.6);
      display: flex; justify-content: center; align-items: center; font-size: 36px;
      background: rgba(15, 52, 96, 0.8); margin-bottom: 20px;
    }
    #cutscene-text {
      font-size: 18px; font-weight: bold; color: #00fff2; min-height: 50px;
      text-shadow: 0 0 10px rgba(0,255,242,0.4); max-width: 320px; line-height: 1.4;
    }
    .skip-btn {
      position: absolute; top: 20px; right: 20px;
      background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.3);
      color: #fff; padding: 6px 14px; border-radius: 20px; font-size: 12px; cursor: pointer;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- Audio Musik Latar Login & Cutscene -->
  <audio id="bg-music" loop>
    <source src="bgmusic.mp3" type="audio/mpeg">
  </audio>

  <!-- FORM LOGIN / REGISTER -->
  <div class="auth-container" id="auth-box">
    <h2 id="auth-title">Login Game</h2>
    <div class="input-group">
      <input type="text" id="username" placeholder="Masukkan Username">
    </div>
    <div class="input-group">
      <input type="password" id="password" placeholder="Masukkan Password">
    </div>
    <button class="auth-btn" id="auth-submit-btn" onclick="handleAuth()">Login</button>
    <div class="switch-auth" onclick="toggleAuthMode()">
      <span id="switch-text">Belum punya akun? Daftar disini</span>
    </div>
    <p id="message"></p>
  </div>

  <!-- CUTSCENE INTRO SETELAH LOGIN -->
  <div id="cutscene-screen" class="hidden">
    <button class="skip-btn" onclick="goToGameDirectly()">Lewati ⏩</button>
    <div class="avatar-box">🤖</div>
    <div id="cutscene-text">Memuat sistem...</div>
  </div>

  <script>
    let isLoginMode = true;

    function toggleAuthMode() {
      isLoginMode = !isLoginMode;
      document.getElementById('auth-title').innerText = isLoginMode ? 'Login Game' : 'Daftar Akun Baru';
      document.getElementById('auth-submit-btn').innerText = isLoginMode ? 'Login' : 'Daftar';
      document.getElementById('switch-text').innerText = isLoginMode ? 'Belum punya akun? Daftar disini' : 'Sudah punya akun? Login disini';
      document.getElementById('message').innerText = '';
    }

    function handleAuth() {
      const userInput = document.getElementById('username').value.trim();
      const passInput = document.getElementById('password').value.trim();
      const message = document.getElementById('message');

      if (!userInput || !passInput) {
        message.style.color = '#ff4d4d';
        message.innerText = 'Isi username dan password!';
        return;
      }

      let users = JSON.parse(localStorage.getItem('game_accounts')) || {};

      // Putar musik saat tombol ditekan agar lolos kebijakan autoplay browser
      const music = document.getElementById('bg-music');
      music.play().catch(e => console.log("Audio play prevented:", e));

      if (isLoginMode) {
        if (users[userInput] && users[userInput] === passInput) {
          message.style.color = '#4def8e';
          message.innerText = 'Login berhasil!';
          localStorage.setItem('current_player', userInput);
          setTimeout(() => startCutscene(userInput), 600);
        } else {
          message.style.color = '#ff4d4d';
          message.innerText = 'Username atau password salah!';
        }
      } else {
        if (users[userInput]) {
          message.style.color = '#ff4d4d';
          message.innerText = 'Username sudah terdaftar!';
        } else {
          users[userInput] = passInput;
          localStorage.setItem('game_accounts', JSON.stringify(users));
          message.style.color = '#4def8e';
          message.innerText = 'Berhasil daftar!';
          localStorage.setItem('current_player', userInput);
          setTimeout(() => startCutscene(userInput), 800);
        }
      }
    }

    // RANGKAIAN ANIMASI CUTSCENE INTRO
    function startCutscene(username) {
      document.getElementById('auth-box').classList.add('hidden');
      document.getElementById('cutscene-screen').classList.remove('hidden');

      const texts = [
        `Inisialisasi sistem... Selamat datang, ${username}!`,
        "Memuat data lokal browser...",
        "Dirancang oleh Master Koding: NABHAN",
        "Didukung oleh GEMINI AI",
        "Memasuki dunia utama game..."
      ];

      let index = 0;
      const textBox = document.getElementById('cutscene-text');

      function showNextText() {
        if (index < texts.length) {
          textBox.innerText = texts[index];
          index++;
          setTimeout(showNextText, 2500);
        } else {
          goToGameDirectly();
        }
      }

      showNextText();
    }

    function goToGameDirectly() {
      window.location.href = 'game.html';
    }
  </script>
</body>
</html>
